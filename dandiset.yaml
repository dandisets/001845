dateCreated: '2026-05-14T19:08:33.453421+00:00'
description: 'This Dandiset contains behavioral data from wild-type and Fmr1 knockout
  rat dyads performing a novel spatial cooperation task designed to investigate the
  behavioral strategies and social mechanisms underlying cooperative behavior. In
  this task, rat pairs learn to coordinate visits to matching reward wells on paired
  spatial mazes under deterministic and probabilistic reward contingencies. The dataset
  includes behavioral event timestamps, reward well visit intervals, and position
  tracking data for both animals within each dyad across multiple sessions (N = 5
  pairs per genotype group). These data support analyses of cooperative performance,
  leader–follower dynamics, behavioral synchrony, and adaptive coordination strategies
  relevant to social cognition and neurodevelopmental disorders. Related findings
  from this dataset are described in: Shukla A, Rivera EL, Bladon JH, Jadhav SP (2026)
  A novel cooperative behavior assay in rats reveals distinct social coordination
  strategies of increasing complexity and social reciprocity deficits in a model of
  Fragile-X Syndrome. Journal of Neuroscience, e0143262026. https://doi.org/10.1523/JNEUROSCI.0143-26.2026.
  This work was supported by the SFARI Autism Rat Models Consortium Grant SFA-AN-AR-Rat
  Models-00012700 to S.P.J.'
